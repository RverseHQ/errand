[project]
name = "errand"
version = "0.1.0"
description = "单进程内的持久化异步任务队列"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rainzee wang", email = "rainzee.w@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.ruff]
line-length = 128
target-version = "py313"

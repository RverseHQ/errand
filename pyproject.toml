[project]
name = "errand"
version = "0.5.1"
description = "单进程内的持久化异步任务队列"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rainzee wang", email = "rainzee.w@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.ruff]
line-length = 128
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PT"]
